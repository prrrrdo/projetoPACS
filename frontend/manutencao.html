<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGMaH - Painel da Manutenção</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="dashboard-container" style="max-width: 1100px;">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-brand">
        <h2>SIGMaH</h2>
        <span>Painel da Equipe de Manutenção</span>
      </div>
      <div class="user-profile-summary">
        <span id="headerUserName">Carregando...</span>
        <button id="btnLogout" class="btn-ghost-sm" title="Sair do sistema">Sair</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-main">
      <section class="card-section">
        <div class="section-header">
          <h3>Demandas</h3>
          <p>Acompanhe e gerencie os chamados abertos pelas unidades e setores.</p>
        </div>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Protocolo</th>
                <th>Solicitante / Unidade</th>
                <th>Local</th>
                <th>Descrição</th>
                <th>Data de Abertura</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="maintenanceTableBody">
              <!-- Preenchido via JavaScript -->
              <tr>
                <td colspan="6" class="text-center text-muted">Carregando demandas...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>&copy; 2026 SIGMaH • Gestão de Manutenção Hospitalar</p>
    </footer>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="manutencao.js"></script>
</body>
</html>
