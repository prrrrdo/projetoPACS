services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      # INSIRA AQUI O SEU USUÁRIO, SENHA E NOME DO BANCO REAIS:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pacsadmin
      POSTGRES_DB: pacs_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata16:/var/lib/postgresql/data

  backend:
    build: .
    container_name: api_backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      # ESTAS VARIÁVEIS DEVEM SER IDÊNTICAS ÀS ACIMA PARA A API ENCONTRAR O BANCO:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=pacsadmin
      - DB_NAME=pacs_db
      - PORT=3000
    depends_on:
      - db

volumes:
  pgdata16:
